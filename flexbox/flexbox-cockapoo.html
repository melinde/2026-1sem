<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox – eksempler</title>
    <link rel="stylesheet" href="flexstyle-cockapoo.css" />
  </head>
  <body>
    <h1>Flexbox – eksempler</h1>

    <h2>1. Almindelige div'er uden Flexbox</h2>
    <div class="container">
      <div>1</div>
      <div>2</div>
      <div>3</div>
    </div>

    <h2>2. Flexbox – flex-end</h2>
    <div class="flex-container">
      <div>1</div>
      <div>2</div>
      <div>3</div>
    </div>

    <h2>3. Flexbox – space-around</h2>
    <div class="flex-container jaevnt">
      <div>1</div>
      <div>2</div>
      <div>3</div>
    </div>

    <h2>4. Flexbox – flex-wrap</h2>
    <div class="flex-container hop-ned">
      <div>1</div>
      <div>2</div>
      <div>3</div>
    </div>

    <h2>5. Flexbox – column og order</h2>
    <div class="flex-container lodret">
      <div>1</div>
      <div class="special">2</div>
      <div>3</div>
    </div>

    <h2>6. Flexbox – billede af en cockapoo</h2>
    <div class="flex-container lodret">
      <div class="billedboks">
        <img src="cockapoo.png" class="my-img" alt="En cockapoo" />
      </div>
      <div class="special">2</div>
      <div>3</div>
    </div>
  </body>
</html>
