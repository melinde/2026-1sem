<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafe Luna</title>
    <link rel="stylesheet" href="flex-opsamling.css" />
  </head>
  <body>
    <header>
      <h1>Café Luna</h1>
      <p>En lille pause i hverdagen</p>
    </header>
    <main>
      <section class="menu">
        <article class="card">
          <img
            src="images/kaffe.jpeg"
            alt="En kop kaffe med latte art"
            class="card-image"
          />
          <h2>Kaffe</h2>
          <p>Friskbrygget kaffe</p>
          <p class="price">35 kr.</p>
        </article>

        <article class="card">
          <img
            src="images/kage.jpg"
            alt="Et stykke kage med frugt"
            class="card-image"
          />
          <h2>Kage</h2>
          <p>Hjemmebagt kage</p>
          <p class="price">45 kr.</p>
        </article>

        <article class="card">
          <img
            src="images/croissant.jpg"
            alt="Croissanter i en skål"
            class="card-image"
          />
          <h2>Croissant</h2>
          <p>Sprød og lækker</p>
          <p class="price">30 kr.</p>
        </article>
      </section>
    </main>
    <footer>
      <p>&copy; 2626 | Café Luna</p>
    </footer>
  </body>
</html>
