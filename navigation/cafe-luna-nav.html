<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafe Luna</title>
    <link rel="stylesheet" href="cafe-luna-nav.css" />
  </head>
  <body>
    <header>
      <div class="header-content">
        <h1 class="logo">Café Luna</h1>
        <nav aria-label="Hovednavigation">
          <ul class="nav-links">
            <li><a href="#forside">Forside</a></li>
            <li><a href="#om-os">Om os</a></li>
            <li><a href="#menu">Menu</a></li>
            <li><a href="#kontakt">Kontakt</a></li>
          </ul>
        </nav>
      </div>
      <p>En lille pause i hverdagen</p>
    </header>
    <main>
      <section class="menu">
        <article class="card">
          <img
            src="images/kaffe.jpeg"
            alt="En kop kaffe med latte art"
            class="card-image"
          />
          <h2>Kaffe</h2>
          <p>Friskbrygget kaffe</p>
          <p class="price">35 kr.</p>
        </article>

        <article class="card">
          <img
            src="images/kage.jpg"
            alt="Et stykke kage med frugt"
            class="card-image"
          />
          <h2>Kage</h2>
          <p>Hjemmebagt kage</p>
          <p class="price">45 kr.</p>
        </article>

        <article class="card">
          <img
            src="images/croissant.jpg"
            alt="Croissanter i en skål"
            class="card-image"
          />
          <h2>Croissant</h2>
          <p>Sprød og lækker</p>
          <p class="price">30 kr.</p>
        </article>
      </section>
    </main>
    <footer id="kontakt">
      <p>&copy; 2026 | Café Luna</p>
    </footer>
  </body>
</html>
